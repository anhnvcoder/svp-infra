# Projects of make infracost (workflow cost.yml): the roots CI plans, priced from their HCL and the values committed
# beside them. A variable with no default and no value in <env>.tfvars (domain, emails, account ids) stays empty: its
# value lives in a *.auto.tfvars, which is never committed. Design notes: docs/reference/ci.md.
version: 0.1

projects:
  - path: aws/envs/stg
    name: envs-stg
    terraform_var_files:
      - stg.tfvars
  - path: aws/envs/prd
    name: envs-prd
    terraform_var_files:
      - prd.tfvars
  # No var file: every value of an account root is in its <env>.auto.tfvars. With no flag of aws/paid-features.json at
  # session, a session opens nothing in these roots, so each prices the same in and out of a session.
  - path: aws/accounts/stg
    name: accounts-stg
  - path: aws/accounts/prd
    name: accounts-prd
