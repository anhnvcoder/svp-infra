# Static checks of every pull request and push to main: make check, one job per group; the ruleset requires infra-ok.
# Public repository, a fork's pull request runs this file with the fork's code, so:
# - no AWS credential, no OIDC (no id-token), no secret, no environment: make check never reaches an account
#   (init with -backend=false, no apply, no AWS CLI; terraform test plans against a mock provider with no network);
# - no pull_request_target, no workflow_run; the jobs that run repository code have contents: read and nothing else;
# - every action is GitHub's own, pinned to a full commit SHA; tools run from images pinned by digest in the Makefile;
# - checkout with persist-credentials: false.
# Design notes: README.md.
name: check

on:
  pull_request:
  push:
    branches: [main]
  # No paths filter: a required check whose workflow does not run is never reported and leaves the pull request waiting.

permissions: {}

concurrency:
  group: check-${{ github.ref }}
  # A new push to a pull request makes its previous run useless; a run on main is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether a pull request changes anything but documentation, so job check skips and infra-ok accepts that skip.
  # Documentation is Markdown, docs/ and LICENSE, but not the README.md of a Terraform directory (aws/, github/):
  # terraform-docs writes part of it and make check holds it to the code. A change of the Makefile or of this workflow,
  # and a push, turn the output true: when in doubt, run. The list comes from GitHub's API, so no history is fetched.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            # Both names of a renamed file. The API lists at most 3000 files of a pull request: a list shorter than the
            # pull request's count of changed files is incomplete, and then every job runs.
            listed=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | [.filename, (.previous_filename // "")] | @tsv')
            count=$(printf '%s\n' "$listed" | grep -c . || true)
            if [ "$count" -eq "$CHANGED" ]; then
              files=$(printf '%s\n' "$listed" | tr '\t' '\n' | grep -v '^$' || true)
            else
              echo "::notice::the API listed $count of the $CHANGED changed files: every job runs"
              files=Makefile
            fi
          else
            files=Makefile
          fi
          printf '%s\n' "$files"
          code=false
          if printf '%s\n' "$files" | grep -v -E -e '^$' -e '^docs/|^LICENSE$|\.md$' | grep -q . ||
            printf '%s\n' "$files" | grep -q -E '^(aws|github)/.*README\.md$'; then
            code=true
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  # One job per check-* group of the Makefile, side by side: the slowest group sets the time to a result instead of
  # their sum. Each job bills its own minutes, rounded up; a public repository's standard runners cost nothing.
  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      # Every group reports even when another fails, so one run shows every failure.
      fail-fast: false
      matrix:
        include:
          - group: terraform
          - group: lint
            token: true
          - group: test
          - group: scripts
            token: true
    name: check (${{ matrix.group }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: make check-${{ matrix.group }}
        env:
          GROUP: ${{ matrix.group }}
          # The run's read-only token, for the two groups that call GitHub alone: tflint --init downloads its AWS
          # ruleset under the token's rate limit instead of the anonymous one shared by the runner's address, and
          # zizmor runs its online audits (impostor commits, actions with known vulnerabilities). The Makefile passes
          # each to its one container. Findings of zizmor show as annotations of the pull request.
          GITHUB_TOKEN: ${{ matrix.token && github.token || '' }}
          GH_TOKEN: ${{ matrix.token && github.token || '' }}
          ZIZMOR_FORMAT: github
        run: make "check-$GROUP"

  # The Markdown lint and internal links, and the D2 diagrams against their SVG, of every pull request, documentation
  # only included. diagrams-check runs here and in no group of job check, so each run renders the diagrams once.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make docs-check diagrams-check

  # The required check: green only when every job above succeeded; check stands for all its groups, any one failing
  # fails it. The one skip accepted is check's on a pull request job changes found documentation only; any other skip,
  # and a cancelled job, is a failure.
  infra-ok:
    if: always()
    needs: [changes, check, docs]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: All checks passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e '
            (.changes.result == "success" and .changes.outputs.code == "false") as $docs_only
            | length == 3 and all(to_entries[]; .value.result == "success"
                or (.value.result == "skipped" and .key == "check" and $docs_only))
          ' <<< "$NEEDS" > /dev/null
