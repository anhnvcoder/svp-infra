# Static checks of every pull request and of every push to main: make check (terraform fmt and validate, tflint, trivy,
# shellcheck, the security lint of the workflows with zizmor, the self-test of the session scripts with fake aws,
# kubectl and terraform, for which the runner's bash, git and jq are all it needs, and terraform test of the modules
# against a mock AWS provider, in a container without network). Job infra-ok is the only check the ruleset of
# main requires, so jobs can be added or renamed without touching the ruleset.
#
# The repository is public and a pull request from a fork runs this workflow with the fork's code, so:
# - no AWS credential of any kind, no OIDC (no id-token permission), no secret, no environment: make check never reaches
#   an account (init runs with -backend=false; nothing calls apply or the AWS CLI; the only plans are those of
#   terraform test, against a mock AWS provider, in a container with no network and no AWS variable);
# - no pull_request_target and no workflow_run: a pull request never runs with a write token;
# - the only job that runs code of the repository has contents: read and nothing else;
# - every action of this workflow is GitHub's own and pinned to a full commit SHA; terraform, tflint, trivy, shellcheck
#   and zizmor run from images pinned by digest in the Makefile, so no third-party action is trusted here;
# - checkout never leaves the token in .git/config (persist-credentials: false).
name: check

on:
  pull_request:
  push:
    branches: [main]
  # No paths filter: a required check whose workflow does not run is never reported and leaves the pull request waiting.

permissions: {}

concurrency:
  group: check-${{ github.ref }}
  # A new push to a pull request makes its previous run useless; a run on main is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether a pull request changes anything but documentation, so job check skips for a pull request that does not and
  # infra-ok accepts that skip. Documentation is Markdown, docs/ and LICENSE, but not the README.md of a Terraform
  # directory (aws/, github/): terraform-docs writes part of it and make check holds it to the code. A change of the
  # Makefile or of this workflow, and a push, turn the output true: when in doubt, run. The list comes from GitHub's API
  # for the pull request, not from git, so no history is fetched.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            # Both names of a renamed file. The API lists at most 3000 files of a pull request: a list shorter than the
            # pull request's count of changed files is incomplete, and then every job runs.
            listed=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | [.filename, (.previous_filename // "")] | @tsv')
            count=$(printf '%s\n' "$listed" | grep -c . || true)
            if [ "$count" -eq "$CHANGED" ]; then
              files=$(printf '%s\n' "$listed" | tr '\t' '\n' | grep -v '^$' || true)
            else
              echo "::notice::the API listed $count of the $CHANGED changed files: every job runs"
              files=Makefile
            fi
          else
            files=Makefile
          fi
          printf '%s\n' "$files"
          code=false
          if printf '%s\n' "$files" | grep -v -E -e '^$' -e '^docs/|^LICENSE$|\.md$' | grep -q . ||
            printf '%s\n' "$files" | grep -q -E '^(aws|github)/.*README\.md$'; then
            code=true
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: make check
        env:
          # Read-only token of the run, so that tflint --init downloads its AWS ruleset from GitHub under the token's
          # rate limit instead of the anonymous one shared by the runner's address. The Makefile passes it to the tflint
          # container alone.
          GITHUB_TOKEN: ${{ github.token }}
          # The same token for zizmor's online audits (impostor commits, actions with known vulnerabilities): the
          # Makefile passes it to the zizmor container alone. Findings show as annotations of the pull request.
          GH_TOKEN: ${{ github.token }}
          ZIZMOR_FORMAT: github
        run: make check

  # The Markdown lint and internal links of every pull request, documentation only included (make check runs it too).
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make docs-check

  # The required check: green only when every job above succeeded. The one skip accepted is check's on a pull request
  # job changes found documentation only; any other skip, and a cancelled job, is a failure.
  infra-ok:
    if: always()
    needs: [changes, check, docs]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: All checks passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e '
            (.changes.result == "success" and .changes.outputs.code == "false") as $docs_only
            | length == 3 and all(to_entries[]; .value.result == "success"
                or (.value.result == "skipped" and .key == "check" and $docs_only))
          ' <<< "$NEEDS" > /dev/null
